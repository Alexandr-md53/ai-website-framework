<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:image" content="/assets/logo/logo.png">
<meta property="og:type" content="website">
{{ canonical_url }}
{{ hreflang_tags }}
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
  <a href="{{ home_url }}" class="logo-link"><img src="/assets/logo/logo.png" alt="{{ cafe_name }} logo" width="120" height="60"></a>
  <nav><a href="{{ home_url }}">{{ nav.home }}</a> <a href="{{ menu_url }}">{{ nav.menu }}</a> <a href="{{ about_url }}">{{ nav.about }}</a></nav>
  <div class="lang-switch"><a href="{{ lang_switch.ru }}">RU</a> | <a href="{{ lang_switch.ro }}">RO</a> | <a href="{{ lang_switch.en }}">EN</a></div>
</header>
<main>{{ body | safe }}</main>
<footer class="site-footer"><div class="footer-inner"><div class="footer-brand">{{ cafe_name }} — {{ cafe_city }}</div><div class="footer-contacts"><div class="footer-address">{{ contact.address }}</div><div class="footer-hours">{{ contact.hours }}</div><div class="footer-phone"><a href="tel:{{ contact.phone }}">{{ contact.phone }}</a></div><div class="footer-map"><a href="{{ contact.map_url }}" target="_blank">{{ contact.map_label }}</a></div></div></div></footer>
</body>
</html>
