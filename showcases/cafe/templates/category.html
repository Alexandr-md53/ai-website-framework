<!DOCTYPE html>
<html lang="{{ lang|default('ru') }}">
<head><title>{{ localized_name|default(category.name) }}</title></head>
<body>
  <h1>{{ localized_name|default(category.name) }}</h1>
  <p>{{ category.slug }}</p>
  <ul>
    {% for iw in items_with_images %}
      <li><a href="/menu/{{ category.slug }}/{{ iw.item.slug }}/">{{ iw.localized_title }}</a>{% if iw.image_url %}<img src="{{ iw.image_url }}" alt="{{ iw.localized_title }}">{% endif %}</li>
    {% endfor %}
  </ul>
</body>
</html>
