<!DOCTYPE html>
<html lang="{{ lang|default('ru') }}">
<head><title>{{ ui.menu.title|default('Menu') }} {{ lang|default('ru') }}</title></head>
<body>
  <h1>{{ ui.menu.title|default('Menu') }}</h1>
  <ul>
    {% for lc in localized_categories %}
      <li><a href="/menu/{{ lc.category.slug }}/">{{ lc.localized_name }}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
