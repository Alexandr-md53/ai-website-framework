[pytest]

minversion = 7.0

addopts = --tb=line --strict-markers

testpaths =
    tests

pythonpath =
    .

console_output_style = classic

markers =
    unit: Модульные тесты
    validation: Тесты модуля валидации
    integration: Интеграционные тесты
    api: Тесты API слоя
    crud: Тесты CRUD движка
    slug: Тесты slug сервиса
    security: Тесты безопасности
    showcases: Тесты доменных шаблонов

filterwarnings =
    error
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore::starlette.exceptions.StarletteDeprecationWarning