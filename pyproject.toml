[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-website-framework"
version = "10.2.0-c1"
description = "AI Website Framework Core Package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-framework = "ai_framework.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_framework*"]